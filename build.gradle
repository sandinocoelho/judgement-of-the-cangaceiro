buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
    }
}

allprojects {

    ext {
        appName = 'Judgement of the Cangaceiro'
        //short name for space-constrained surfaces (Android launcher label)
        appShortName = 'Cangaceiro'
        appPackageName = 'cloud.sandino.judgementofthecangaceiro'

        //never decrement below 896 (upstream SPD compat code is keyed on version codes,
        // see docs/recommended-changes.md); '+' for build metadata, '-' would mean pre-release.
        //versionName scheme: <fork semver>+spd<upstream base>, tag = v<versionName>
        appVersionCode = 898
        appVersionName = '0.1.0+spd3.3.8'

        appJavaCompatibility = JavaVersion.VERSION_11

        appAndroidCompileSDK = 36   //Android 15
        appAndroidMinSDK = 21       //Android 5.0
        appAndroidTargetSDK = 36    //Android 15

        gdxVersion = '1.14.0'
        gdxControllersVersion = '2.2.4'
        robovmVersion = '2.3.24'
    }
    version = appVersionName

    repositories {
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }

}