# CANGA-29 (E8) — CI pipeline for merge requests and pushes to main.
#
# Scope: android:assembleDebug + a desktop debug smoke-run, plus an
# allow_failure lint pass. iOS is intentionally excluded (CANGA-31 —
# iOS stays a manual Mac runbook; GitLab macOS runners are paid/scarce).
#
# GitLab.com Free gives ~400 CI minutes/month. Check Settings > CI/CD >
# Usage Quotas periodically; if this pipeline threatens that budget,
# escalate to the stakeholder (buy extra minutes vs. a dedicated
# runner) rather than letting jobs silently queue or get throttled.

stages:
  - build
  - lint
  - release-build
  - release-publish

variables:
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  # Google's cmdline-tools download has no "latest" alias; bump this when it goes stale.
  ANDROID_CMDLINE_TOOLS_URL: "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

.rules_mr_and_main:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# NOTE: GitLab's `extends` replaces array-valued keys wholesale rather than
# concatenating them, so a job can only pull its `cache:` list from ONE of
# these hidden templates. .android_cache below carries both entries (Gradle +
# SDK) for the two Android jobs; .gradle_cache alone covers the desktop job.
.gradle_cache_entry: &gradle_cache_entry
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - build.gradle
  paths:
    - .gradle/wrapper
    - .gradle/caches

.android_sdk_cache_entry: &android_sdk_cache_entry
  key: "android-sdk-$ANDROID_COMPILE_SDK-$ANDROID_BUILD_TOOLS"
  paths:
    - .android-sdk/

.gradle_cache:
  cache:
    - *gradle_cache_entry

.android_cache:
  cache:
    - *gradle_cache_entry
    - *android_sdk_cache_entry

.android_sdk_setup:
  image: eclipse-temurin:17-jdk
  before_script:
    # Idempotent: when the .android-sdk/ cache is warm (restored from another
    # job's save), everything below the existence check is skipped — repeating
    # the mv against an existing target is what broke the first lint run.
    - |
      export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
      if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
        apt-get update -qq && apt-get install -y -qq wget unzip
        wget -q "$ANDROID_CMDLINE_TOOLS_URL" -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        mv /tmp/cmdline-tools-extract/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
        # `|| true`: sdkmanager stops reading stdin once all licenses are
        # accepted, so `yes` gets SIGPIPE (exit 141) — harmless, but the CI
        # shell runs with pipefail and would otherwise fail the job on it.
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
      fi

android:assembleDebug:
  extends:
    - .rules_mr_and_main
    - .android_sdk_setup
    - .android_cache
  stage: build
  script:
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
    - ./gradlew :android:assembleDebug --console=plain
  artifacts:
    expire_in: 3 days
    paths:
      - android/build/outputs/apk/debug/*.apk

android:lint:
  extends:
    - .rules_mr_and_main
    - .android_sdk_setup
    - .android_cache
  stage: lint
  allow_failure: true
  script:
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
    - ./gradlew :android:lintDebug --console=plain
  artifacts:
    expire_in: 3 days
    when: always
    paths:
      - android/build/reports/lint-results-debug.html

desktop:debugSmoke:
  extends:
    - .rules_mr_and_main
    - .gradle_cache
  image: eclipse-temurin:17-jdk
  stage: build
  before_script:
    # Xvfb gives LWJGL/GLFW an X server to open a window against; the mesa
    # packages give it a software GL context since the runner has no GPU.
    - apt-get update -qq && apt-get install -y -qq xvfb libgl1-mesa-dri libopenal1 libxcursor1 libxi6 libxrandr2
  script:
    # Build first, untimed — a compile failure fails the job here, with the
    # full Gradle error visible in the job log.
    - ./gradlew :desktop:classes --console=plain
    - |
      set +e
      # Everything is compiled by now, so 30s is pure game startup + idle. The
      # game has no "exit after N seconds" mode and nobody closes the window in
      # CI, so a healthy run ALWAYS ends via this timeout — which also means
      # Gradle never gets to print BUILD SUCCESSFUL for the run itself; the
      # startup marker grep below is the actual pass/fail signal.
      xvfb-run --auto-servernum -- timeout 30s ./gradlew :desktop:debug --console=plain > desktop-debug.log 2>&1
      EXIT_CODE=$?
      set -e
      cat desktop-debug.log
      # 124/143 = the two timeout(1) exit conventions (xvfb-run's passthrough
      # varies across versions); 0 = the game exited cleanly on its own.
      case "$EXIT_CODE" in
        0|124|143) ;;
        *)
          echo "desktop debug smoke run failed with exit code $EXIT_CODE"
          exit 1
          ;;
      esac
      # "[Controllers] added manager" is logged once the libGDX application is
      # fully created — i.e. window, GL context, and game init all succeeded.
      grep -q "\[Controllers\] added manager" desktop-debug.log
      ! grep -qi "Has Crashed\|BUILD FAILED" desktop-debug.log
  artifacts:
    expire_in: 3 days
    when: always
    paths:
      - desktop-debug.log

# ---------------------------------------------------------------------------
# CD por tag (CANGA-30 / E9): tag protegida v* -> builds de release assinados
# -> gate MANUAL -> Release no GitHub + mirror da tag exata.
# Ensaio: use uma tag com hífen (ex.: v0.0.1-rc1) — ela vira prerelease no
# GitHub, e o updates checker in-game (A2) só a oferece a quem opta por betas.
# Pipeline verde NÃO substitui o smoke manual do APK R8 (regra do B4).
# ---------------------------------------------------------------------------

.rules_release_tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

android:assembleReleaseSigned:
  extends:
    - .rules_release_tag
    - .android_sdk_setup
    - .android_cache
  stage: release-build
  script:
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
    # GitLab's official helper downloads every Secure File to .secure_files/
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    # KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD are masked+protected project
    # variables (CANGA-28); tags v* are protected, so they are available here.
    - printf 'storeFile=%s/.secure_files/judgement-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$CI_PROJECT_DIR" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
    - ./gradlew :android:assembleRelease --console=plain
    # the signed APK is android-release.apk; if signing silently fell through
    # we'd get android-release-unsigned.apk instead — fail loudly in that case
    - test -f android/build/outputs/apk/release/android-release.apk
  artifacts:
    # never expires: the R8 mapping must be retrievable for the lifetime of
    # this release build to deobfuscate player crash reports (AC do E9)
    expire_in: never
    paths:
      - android/build/outputs/apk/release/android-release.apk
      - android/build/outputs/mapping/release/mapping.txt

desktop:releaseArtifacts:
  extends:
    - .rules_release_tag
    - .gradle_cache
  image: eclipse-temurin:17-jdk
  stage: release-build
  before_script:
    # binutils: jlink's --strip-debug shells out to objcopy
    - apt-get update -qq && apt-get install -y -qq binutils zip
  script:
    - ./gradlew :desktop:release :desktop:jpackageImage --console=plain
    - cd desktop/build/jpackage && zip -qr "$CI_PROJECT_DIR/JudgementOfTheCangaceiro-linux-x64.zip" . && cd "$CI_PROJECT_DIR"
  artifacts:
    expire_in: never
    paths:
      - desktop/build/libs/desktop-*.jar
      - JudgementOfTheCangaceiro-linux-x64.zip

# Gate manual: nada é publicado fora do GitLab sem um humano apertar o botão.
# Instaladores desktop Win/macOS ficam fora do CD por decisão (runbooks
# manuais — ver docs/release-signing.md e CANGA-31 para o lado iOS/mac).
publish:github:
  extends:
    - .rules_release_tag
  image: eclipse-temurin:17-jdk
  stage: release-publish
  when: manual
  needs:
    - android:assembleReleaseSigned
    - desktop:releaseArtifacts
  variables:
    # full clone: mirroring a shallow default clone would push a broken history
    GIT_DEPTH: "0"
    GH_REPO: "sandinocoelho/judgement-of-the-cangaceiro"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl jq zip
  script:
    # --- mirror (regras do E4: só a tag exata, NUNCA glob; main só fast-forward) ---
    - git remote add github "https://oauth2:${GH_PAT}@github.com/${GH_REPO}.git" || git remote set-url github "https://oauth2:${GH_PAT}@github.com/${GH_REPO}.git"
    - git fetch origin main
    - git push github "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
    # sem --force: se main do GitHub não for ancestral, o push falha e o job
    # para — investigar manualmente, jamais forçar (checklist do E4)
    - git push github "refs/remotes/origin/main:refs/heads/main"
    # --- Release no GitHub (endpoint consumido pelo GitHubUpdates, A2) ---
    - VERSION_CODE=$(grep -oE 'appVersionCode = [0-9]+' build.gradle | grep -oE '[0-9]+')
    - VERSION_NAME=$(grep -oE "appVersionName = '[^']+'" build.gradle | cut -d"'" -f2)
    - case "$CI_COMMIT_TAG" in *-*) PRERELEASE=true;; *) PRERELEASE=false;; esac
    # o corpo segue o formato que o updates checker parseia: descrição, linha
    # em branco, '---', e a linha "internal version number: NNN"
    - |
      BODY=$(printf 'Judgement of the Cangaceiro %s (%s)\n\n---\n\ninternal version number: %s\n' "$CI_COMMIT_TAG" "$VERSION_NAME" "$VERSION_CODE")
      PAYLOAD=$(jq -n --arg tag "$CI_COMMIT_TAG" --arg body "$BODY" --argjson pre "$PRERELEASE" \
        '{tag_name: $tag, name: $tag, body: $body, prerelease: $pre, draft: false}')
      RELEASE_ID=$(curl --fail-with-body -sS -X POST \
        -H "Authorization: Bearer ${GH_PAT}" -H "Accept: application/vnd.github+json" \
        "https://api.github.com/repos/${GH_REPO}/releases" -d "$PAYLOAD" | jq -r '.id')
      echo "GitHub release created: id $RELEASE_ID"
    - |
      upload_asset() {
        local path="$1"
        local name_enc
        name_enc=$(basename "$path" | jq -sRr @uri)
        curl --fail-with-body -sS -X POST \
          -H "Authorization: Bearer ${GH_PAT}" -H "Content-Type: application/octet-stream" \
          --data-binary @"$path" \
          "https://uploads.github.com/repos/${GH_REPO}/releases/${RELEASE_ID}/assets?name=${name_enc}" > /dev/null
        echo "uploaded: $(basename "$path")"
      }
      upload_asset android/build/outputs/apk/release/android-release.apk
      upload_asset desktop/build/libs/desktop-*.jar
      upload_asset JudgementOfTheCangaceiro-linux-x64.zip
    - 'echo "Release ${CI_COMMIT_TAG} publicada e espelhada. Lembrete B4: rode o smoke manual do APK R8."'
